name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /var/www/myapp

            echo "Pull code..."
            git pull origin master

            echo "Install dependencies..."
            npm ci

            echo "Build..."
            npm run build

            echo "Reload PM2..."
            pm2 reload myapp

            pm2 save